services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stickyboard
      # Required — no default. Generate with: openssl rand -hex 32
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: stickyboard
    # Not published to the host. App reaches Postgres on the Compose network
    # only (db:5432). For local `npm run dev`, use docker-compose.dev.yml.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stickyboard -d stickyboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: postgresql://stickyboard:${POSTGRES_PASSWORD}@db:5432/stickyboard
      # Optional. Leave unset and Docker generates + persists a unique secret
      # on first boot. If you set one yourself, it must be a strong random
      # value — known placeholders are rejected at startup.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Required for first-boot admin creation. Production bootstrap fails if
      # these are unset or the password is weak (see scripts/bootstrap.mjs).
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
